<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07090c">
<link rel="apple-touch-icon" href="icon-192.png">
<!--
  =====================================================================
  PERSONAL ASSISTANT HOME SCREEN
  One file. No install. Open it in Edge (start-assistant.cmd does this).

  How this file is organized (top to bottom):
    1. <style>   -> how everything LOOKS (colors, layout, fonts)
    2. <body>    -> WHAT is on the screen (name, ring, caption, settings)
    3. <script>  -> what everything DOES (talking, animation, saving settings)

  Safe things to edit by hand:
    - The colors in :root below (--accent is the blue).
    - DEFAULTS in the script (default greeting, your name).
  Everything else can be changed from the gear icon on screen.
  =====================================================================
-->
<style>
  /* ---------- 1. COLORS & BASICS ---------- */
  :root{
    --bg:#07090c;              /* near-black background */
    --panel:#0d1116;           /* settings panel */
    --line:rgba(160,175,190,.22);
    --silver:#c9d1d9;
    --dim:#6b7580;
    --accent:#3fa9ff;          /* the blue. Change this to recolor everything */
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--silver);
    font-family:Bahnschrift,"Segoe UI",system-ui,sans-serif;overflow:hidden}

  /* background image (set in settings) + dark shade on top of it */
  #bg{position:fixed;inset:0;background-size:cover;background-position:center;opacity:.45}
  #shade{position:fixed;inset:0;
    background:radial-gradient(ellipse at 65% 50%,rgba(7,9,12,.2),rgba(7,9,12,.85) 70%)}

  /* HUD corner brackets */
  .c{position:fixed;width:42px;height:42px;border:1px solid var(--line)}
  .tl{top:22px;left:22px;border-right:0;border-bottom:0}
  .tr{top:22px;right:22px;border-left:0;border-bottom:0}
  .bl{bottom:22px;left:22px;border-right:0;border-top:0}
  .br{bottom:22px;right:22px;border-left:0;border-top:0}

  .tag{font-size:11px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
  #status{position:fixed;top:30px;left:76px}
  #status b{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--accent);margin-right:8px;box-shadow:0 0 8px var(--accent);
    animation:blink 2.4s infinite}
  @keyframes blink{50%{opacity:.25}}

  /* ---------- 2. LAYOUT: name on the left, ring on the right ---------- */
  main{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    gap:5vw;padding:0 6vw}
  .left{flex:0 0 auto}
  #nameText{font-size:clamp(40px,6.5vw,116px);font-weight:300;letter-spacing:.14em;
    margin:12px 0 8px;line-height:1.05;white-space:nowrap;display:inline-block;padding-right:.1em;
    background:linear-gradient(180deg,#f2f6f9 10%,#7d8792 95%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .rule{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:14px 0}
  #clock{font-size:clamp(18px,2vw,26px);letter-spacing:.08em}
  #date{margin-top:6px}

  .right{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
    width:min(44vw,66vh)}
  #ring{width:100%;aspect-ratio:1;cursor:pointer;display:block}

  /* the speech bubble under the ring */
  #bubble{position:relative;margin-top:6px;max-width:100%;min-width:60%;
    padding:16px 22px;border:1px solid var(--line);background:rgba(13,17,22,.78);
    font-size:clamp(15px,1.5vw,21px);line-height:1.45;text-align:center;
    opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
  #bubble.show{opacity:1;transform:none}
  #bubble::before{content:"";position:absolute;top:-7px;left:50%;width:12px;height:12px;
    background:inherit;border-left:1px solid var(--line);border-top:1px solid var(--line);
    transform:translateX(-50%) rotate(45deg)}
  .w{opacity:.18;transition:opacity .15s,color .15s}
  .w.on{opacity:1;color:#fff}

  /* the WAKE button (only appears if the browser blocked sound at startup) */
  #wake{position:fixed;z-index:25;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(7,9,12,.55)}
  #wake.show{display:flex}
  #wakeBtn{font:inherit;font-size:20px;letter-spacing:.3em;color:#fff;cursor:pointer;
    padding:18px 42px;background:transparent;border:1px solid var(--accent);
    box-shadow:0 0 24px rgba(63,169,255,.35)}

  /* gear button + settings panel */
  #gear{position:fixed;z-index:28;top:24px;right:72px;background:none;border:0;color:var(--dim);
    font-size:22px;cursor:pointer}
  #gear:hover{color:var(--silver)}
  #settings{position:fixed;z-index:30;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.6)}
  #settings.show{display:flex}
  .panel{background:var(--panel);border:1px solid var(--line);padding:26px 28px;
    width:min(520px,90vw);max-height:88vh;overflow:auto}
  .panel h2{margin:0 0 18px;font-weight:400;letter-spacing:.2em;font-size:15px}
  .panel label{display:block;margin:14px 0 6px}
  .panel input[type=text],.panel input[type=password],.panel textarea,.panel select{width:100%;box-sizing:border-box;
    background:#07090c;color:var(--silver);border:1px solid var(--line);padding:9px;
    font:inherit;font-size:14px}
  .panel textarea{height:78px;resize:vertical}
  .hint{font-size:12px;color:var(--dim);margin-top:4px}
  .row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .panel button{font:inherit;font-size:13px;letter-spacing:.15em;cursor:pointer;
    padding:9px 16px;background:transparent;color:var(--silver);border:1px solid var(--line)}
  .panel button.primary{border-color:var(--accent);color:#fff}
  #bgPreview{margin-top:8px;height:60px;background-size:cover;background-position:center;
    border:1px solid var(--line);display:none}

  @media (max-width:800px){ main{flex-direction:column;gap:2vh} .right{width:min(80vw,50vh)} }
</style>
</head>
<body>
  <!-- ---------- WHAT IS ON THE SCREEN ---------- -->
  <div id="bg"></div><div id="shade"></div>
  <div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
  <div id="status" class="tag"><b></b>System online</div>
  <button id="gear" title="Settings" aria-label="Settings">&#9881;</button>

  <main>
    <div class="left">
      <div id="logoSlot"></div>
      <div class="tag" id="sub">Personal assistant // Config 01</div>
      <h1 id="nameText">UNNAMED</h1>
      <div class="rule"></div>
      <div id="clock">--:--</div>
      <div id="date" class="tag">----</div>
    </div>
    <div class="right">
      <canvas id="ring" title="Click to hear the greeting again"></canvas>
      <div id="bubble" aria-live="polite"></div>
    </div>
  </main>

  <div id="wake"><button id="wakeBtn">WAKE</button></div>

  <div id="settings">
    <div class="panel">
      <h2>SETTINGS</h2>
      <label for="sName">Assistant name</label>
      <input id="sName" type="text" placeholder="Leave blank for UNNAMED">
      <label for="sUser">Your name</label>
      <input id="sUser" type="text">
      <label for="sGreet">Greeting</label>
      <textarea id="sGreet"></textarea>
      <div class="hint">Fill-ins: {greet} = Good morning/afternoon/evening, {user}, {name}, {time}, {day}</div>
      <label for="sVoice">Voice</label>
      <select id="sVoice"></select>
      <div class="hint">"Natural" voices sound best but need internet.</div>
      <label for="sRate">Speaking speed: <span id="rateVal"></span></label>
      <input id="sRate" type="range" min="0.7" max="1.4" step="0.05" style="width:100%">
      <label style="display:flex;gap:8px;align-items:center;margin-top:20px">
        <input id="sUseEl" type="checkbox"> Use ElevenLabs voice
      </label>
      <label for="sElKey">ElevenLabs API key</label>
      <input id="sElKey" type="password" autocomplete="off" placeholder="Paste your key here (saved only on this computer)">
      <label for="sElVoice">ElevenLabs Voice ID</label>
      <input id="sElVoice" type="text" autocomplete="off" placeholder="e.g. 21m00Tcm4TlvDq8ikWAM">
      <div class="hint">If ElevenLabs fails, it switches to the voice above and tells you why.</div>
      <label for="sBg">Background image</label>
      <input id="sBg" type="file" accept="image/*">
      <div id="bgPreview"></div>
      <div class="row">
        <button id="bgClear">REMOVE BACKGROUND</button>
      </div>
      <div class="row">
        <button id="test">TEST GREETING</button>
        <button id="save" class="primary">SAVE</button>
        <button id="close">CLOSE</button>
      </div>
    </div>
  </div>

<script>
/* =====================================================================
   3. WHAT EVERYTHING DOES
   ===================================================================== */

/* ---- The logo (original design: hexagon, segmented ring, blue dot) ---- */
const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="44" height="44">
  <polygon points="32,3 57,17.5 57,46.5 32,61 7,46.5 7,17.5" fill="#15191e" stroke="#8a939d" stroke-width="2"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#5b636d" stroke-width="3.5" stroke-dasharray="17.5 6.06" transform="rotate(-45 32 32)"/>
  <rect x="27" y="27" width="10" height="10" fill="#c9d1d9" transform="rotate(45 32 32)"/>
  <circle cx="32" cy="11" r="3" fill="#3fa9ff"/>
</svg>`;
document.getElementById('logoSlot').innerHTML = LOGO_SVG;
// use the same logo as the little icon on the window/tab
(function(){const l=document.createElement('link');l.rel='icon';
  l.href='data:image/svg+xml,'+encodeURIComponent(LOGO_SVG);document.head.appendChild(l);})();

/* ---- Settings: defaults, loading, saving ---- */
const DEFAULTS = {
  assistantName: "",
  userName: "",
  greeting: "{greet}, {user}. It's {time} on {day}. All systems are online. Try not to procrastinate tonight.",
  voice: "",
  rate: 1,
  background: "",
  useEl: false,
  elKey: "",
  elVoice: ""
};
const KEY = 'assistant.settings';
function loadSettings(){
  try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(KEY) || '{}')); }
  catch(e){ return Object.assign({}, DEFAULTS); }
}
function saveSettings(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ return false; }   // usually means the background image is too big
}
let S = loadSettings();

function applySettings(){
  const nm = (S.assistantName || '').trim();
  document.getElementById('nameText').textContent = nm ? nm.toUpperCase() : 'UNNAMED';
  document.title = nm || 'Assistant';
  document.getElementById('bg').style.backgroundImage = S.background ? `url("${S.background}")` : 'none';
}
applySettings();

/* ---- Clock ---- */
function tick(){
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  document.getElementById('date').textContent =
    d.toLocaleDateString([], {weekday:'long'}) + ' · ' + d.toLocaleDateString([], {month:'short', day:'numeric', year:'numeric'});
}
tick(); setInterval(tick, 1000);

/* ---- Build the greeting text from the template ---- */
function greetingText(template){
  const d = new Date(), h = d.getHours();
  const greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  return (template || S.greeting)
    .replaceAll('{greet}', greet)
    .replaceAll('{user}', S.userName || 'there')
    .replaceAll('{name}', (S.assistantName || 'your assistant'))
    .replaceAll('{time}', d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}))
    .replaceAll('{day}', d.toLocaleDateString([], {weekday:'long'}));
}

/* ---- Voices (the free ones built into Windows/Edge) ---- */
const synth = window.speechSynthesis;
function allVoices(){ return synth ? synth.getVoices() : []; }
function pickVoice(){
  const vs = allVoices();
  return vs.find(v => v.name === S.voice)
      || vs.find(v => /natural/i.test(v.name) && /^en-US/i.test(v.lang))
      || vs.find(v => /^en-US/i.test(v.lang))
      || vs[0] || null;
}
function voicesReady(){
  return new Promise(res => {
    if (allVoices().length) return res();
    let done = false; const fin = () => { if(!done){ done = true; res(); } };
    if (synth) synth.onvoiceschanged = fin;
    setTimeout(fin, 2000);
  });
}

/* ---- Talking + the speech bubble ---- */
let speaking = false;   // is it talking right now? (the ring watches this)
let energy = 0;         // jumps up on every word -> makes the ring pulse
let hideTimer = null;
let speechId = 0;       // which greeting is the latest one
const bubble = document.getElementById('bubble');

function speakBrowser(text, onBlocked){
  if (!synth) { showWords(text, true); return; }
  synth.cancel();
  clearTimeout(hideTimer);

  // put each word in its own <span> so we can light them up one at a time
  const words = text.split(/\s+/).filter(Boolean);
  const spans = showWords(text, false);
  const offsets = []; let p = 0;
  for (const w of words){ p = text.indexOf(w, p); offsets.push(p); p += w.length; }

  let shown = -1, gotBoundary = false, fallback = null, started = false;
  const reveal = n => {
    n = Math.min(n, words.length - 1);
    if (n <= shown) return;
    for (let k = shown + 1; k <= n; k++) spans[k].classList.add('on');
    shown = n; energy = 1;
  };

  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(); if (v) u.voice = v;
  u.rate = Number(S.rate) || 1;

  u.onstart = () => {
    started = true; speaking = true; bubble.classList.add('show');
    // Some voices don't report word timing; if so, light words on a timer instead.
    setTimeout(() => {
      if (!gotBoundary && speaking){
        let n = shown + 1;
        fallback = setInterval(() => { reveal(n++); if (n >= words.length) clearInterval(fallback); }, 330 / u.rate);
      }
    }, 600);
  };
  u.onboundary = e => {
    if (e.name && e.name !== 'word') return;
    gotBoundary = true;
    if (fallback){ clearInterval(fallback); fallback = null; }
    let n = 0; while (n + 1 < offsets.length && offsets[n + 1] <= e.charIndex) n++;
    reveal(n);
  };
  const finish = () => {
    speaking = false; clearInterval(fallback); reveal(words.length - 1);
    hideTimer = setTimeout(() => bubble.classList.remove('show'), 8000);
  };
  u.onend = finish;
  u.onerror = e => {
    finish();
    if (e.error === 'not-allowed' && onBlocked) onBlocked();
  };

  const myId = ++speechId;
  synth.speak(u);
  // If the browser silently refused to talk (sound blocked at startup), report it.
  setTimeout(() => {
    if (!started && onBlocked && myId === speechId){ synth.cancel(); onBlocked(); }
  }, 2500);
}


/* ---- Which voice to use: ElevenLabs if set up, otherwise the free Windows voice ---- */
function speak(text, onBlocked){
  if (S.useEl && S.elKey && S.elVoice){
    speakEleven(text, onBlocked).catch(err => {
      speaking = false;
      showWords('Voice service problem: ' + err.message + ' Using the built-in voice.', true);
      setTimeout(() => speakBrowser(text, onBlocked), 2500);
    });
  } else {
    speakBrowser(text, onBlocked);
  }
}

/* ---- ElevenLabs voice: fetch audio + word timings, play it, sync the bubble and ring ---- */
let audioCtx = null, currentAudio = null;
async function speakEleven(text, onBlocked){
  if (synth) synth.cancel();
  if (currentAudio){ currentAudio.pause(); currentAudio = null; }
  clearTimeout(hideTimer);
  const myId = ++speechId;

  const res = await fetch('https://api.elevenlabs.io/v1/text-to-speech/' + encodeURIComponent(S.elVoice) +
    '/with-timestamps?output_format=mp3_44100_128', {
    method: 'POST',
    headers: { 'xi-api-key': S.elKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, model_id: 'eleven_flash_v2_5' })
  });
  if (!res.ok){
    const why = res.status === 401 ? 'the API key was rejected.'
              : res.status === 404 ? 'that Voice ID was not found.'
              : res.status === 429 ? 'out of credits or too many requests.'
              : 'error ' + res.status + '.';
    throw new Error(why);
  }
  const data = await res.json();
  if (myId !== speechId) return;   // a newer greeting started meanwhile

  // turn the audio into something playable
  const bytes = Uint8Array.from(atob(data.audio_base64), c => c.charCodeAt(0));
  const url = URL.createObjectURL(new Blob([bytes], { type: 'audio/mpeg' }));
  const audio = new Audio(url); currentAudio = audio;

  // listen to the real audio so the ring moves with the voice
  let analyser = null, buf = null;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 512;
    src.connect(analyser); analyser.connect(audioCtx.destination);
    buf = new Uint8Array(analyser.fftSize);
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  } catch (e) { analyser = null; }

  // work out when each word starts
  const words = text.split(/\s+/).filter(Boolean);
  const spans = showWords(text, false);
  const al = data.alignment || data.normalized_alignment;
  const starts = []; let p = 0;
  for (const w of words){
    p = text.indexOf(w, p);
    const t = al && al.character_start_times_seconds && al.character_start_times_seconds[p];
    starts.push(typeof t === 'number' ? t : null);
    p += w.length;
  }

  let shown = -1;
  const reveal = n => {
    n = Math.min(n, words.length - 1);
    for (let k = shown + 1; k <= n; k++) spans[k].classList.add('on');
    if (n > shown) shown = n;
  };
  const loop = () => {
    if (currentAudio !== audio || audio.paused) return;
    const t = audio.currentTime, dur = audio.duration || 1;
    let n = -1;
    for (let i = 0; i < words.length; i++){
      const st = starts[i] !== null ? starts[i] : (i / words.length) * dur;
      if (st <= t) n = i; else break;
    }
    reveal(n);
    if (analyser){
      analyser.getByteTimeDomainData(buf);
      let sum = 0; for (let i = 0; i < buf.length; i++){ const v = (buf[i] - 128) / 128; sum += v * v; }
      energy = Math.max(energy, Math.min(1, Math.sqrt(sum / buf.length) * 4));
    } else { energy = 0.6; }
    requestAnimationFrame(loop);
  };

  audio.onplay = () => { speaking = true; bubble.classList.add('show'); requestAnimationFrame(loop); };
  audio.onended = () => {
    speaking = false; reveal(words.length - 1); URL.revokeObjectURL(url);
    hideTimer = setTimeout(() => bubble.classList.remove('show'), 8000);
  };
  try { await audio.play(); }
  catch (e) {
    if (e.name === 'NotAllowedError' && onBlocked){ onBlocked(); return; }
    throw new Error('could not play the audio.');
  }
}

function showWords(text, allOn){
  bubble.innerHTML = '';
  const spans = text.split(/\s+/).filter(Boolean).map(w => {
    const s = document.createElement('span'); s.className = 'w' + (allOn ? ' on' : '');
    s.textContent = w + ' '; bubble.appendChild(s); return s;
  });
  if (allOn) bubble.classList.add('show');
  return spans;
}

/* ---- WAKE button: backup if Windows/Edge blocked sound at startup ---- */
const wake = document.getElementById('wake');
function showWake(){ wake.classList.add('show'); }
document.getElementById('wakeBtn').onclick = () => { wake.classList.remove('show'); speak(greetingText()); };

/* ---- The animated ring ---- */
const cv = document.getElementById('ring'), ctx = cv.getContext('2d');
let level = 0, t = 0;
function sizeCanvas(){
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = Math.max(1, r.width * d); cv.height = Math.max(1, r.height * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
window.addEventListener('resize', sizeCanvas); sizeCanvas();

function draw(){
  const w = cv.clientWidth, h = cv.clientHeight, cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.30;
  t += 0.016; energy *= 0.93;
  const target = speaking ? Math.max(energy, 0.22 + 0.12 * Math.abs(Math.sin(t * 6.5))) : 0.05 + 0.03 * Math.sin(t * 1.4);
  level += (target - level) * 0.12;
  ctx.clearRect(0, 0, w, h);

  // faint outer guide rings + tick marks
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(160,175,190,.16)';
  ctx.beginPath(); ctx.arc(cx, cy, R * 1.58, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([2, 6]); ctx.beginPath(); ctx.arc(cx, cy, R * 1.44, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  for (let i = 0; i < 4; i++){
    const a = i * Math.PI / 2;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * R * 1.52, cy + Math.sin(a) * R * 1.52);
    ctx.lineTo(cx + Math.cos(a) * R * 1.66, cy + Math.sin(a) * R * 1.66); ctx.stroke();
  }

  // slowly rotating segmented arc
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 0.18);
  ctx.strokeStyle = 'rgba(63,169,255,.35)'; ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++){ ctx.beginPath(); ctx.arc(0, 0, R * 1.3, i * 2.094, i * 2.094 + 1.2); ctx.stroke(); }
  ctx.restore();

  // soft glow in the middle (brighter while talking)
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.1);
  g.addColorStop(0, `rgba(63,169,255,${0.10 + level * 0.30})`); g.addColorStop(1, 'rgba(63,169,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 1.1, 0, Math.PI * 2); ctx.fill();

  // the wavy rings: they ripple harder the louder "level" is
  ctx.shadowColor = '#3fa9ff'; ctx.shadowBlur = 16;
  for (let k = 0; k < 5; k++){
    const amp = level * (1 - k * 0.13) * R * 0.22;
    ctx.beginPath();
    for (let a = 0; a <= Math.PI * 2 + 0.01; a += 0.03){
      const r = R * (1 - k * 0.07) + amp * (0.6 * Math.sin(a * 5 + t * 2.2 + k) + 0.4 * Math.sin(a * 9 - t * 3.1 + k * 2));
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      a === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `rgba(${120 + k * 10},${195 + k * 8},255,${0.9 - k * 0.15})`;
    ctx.lineWidth = Math.max(0.6, 2.2 - k * 0.35); ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // drifting particle dots
  ctx.fillStyle = 'rgba(150,205,255,.55)';
  for (let i = 0; i < 90; i++){
    const a = i * 0.0698 + t * 0.05;
    const r = R * 1.18 + Math.sin(i * 12.9898 + t * 1.3) * R * (0.05 + level * 0.12);
    ctx.fillRect(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 1.4, 1.4);
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* Click the ring (or press Space) to hear the greeting again */
cv.onclick = () => speak(greetingText());
document.addEventListener('keydown', e => {
  if (document.getElementById('settings').classList.contains('show')) return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); speak(greetingText()); }
});

/* ---- Settings panel ---- */
const $ = id => document.getElementById(id);
const panel = $('settings');
let pendingBg = null;

function fillVoiceList(){
  const sel = $('sVoice'); sel.innerHTML = '';
  const chosen = pickVoice();
  allVoices().filter(v => /^en/i.test(v.lang)).forEach(v => {
    const o = document.createElement('option'); o.value = v.name; o.textContent = `${v.name} (${v.lang})`;
    if (chosen && v.name === chosen.name) o.selected = true; sel.appendChild(o);
  });
}
function openSettings(){
  $('sName').value = S.assistantName; $('sUser').value = S.userName; $('sGreet').value = S.greeting;
  $('sUseEl').checked = !!S.useEl; $('sElKey').value = S.elKey || ''; $('sElVoice').value = S.elVoice || '';
  $('sRate').value = S.rate; $('rateVal').textContent = Number(S.rate).toFixed(2) + 'x';
  pendingBg = null; showBgPreview(S.background); fillVoiceList(); panel.classList.add('show');
}
function showBgPreview(src){
  const p = $('bgPreview'); p.style.display = src ? 'block' : 'none'; p.style.backgroundImage = src ? `url("${src}")` : 'none';
}
function readForm(){
  S.assistantName = $('sName').value.trim(); S.userName = $('sUser').value.trim();
  S.greeting = $('sGreet').value.trim() || DEFAULTS.greeting;
  S.voice = $('sVoice').value; S.rate = Number($('sRate').value);
  S.useEl = $('sUseEl').checked; S.elKey = $('sElKey').value.trim(); S.elVoice = $('sElVoice').value.trim();
  if (pendingBg !== null) S.background = pendingBg;
}
$('gear').onclick = openSettings;
$('close').onclick = () => panel.classList.remove('show');
$('sRate').oninput = () => { $('rateVal').textContent = Number($('sRate').value).toFixed(2) + 'x'; };
$('test').onclick = () => { const keep = Object.assign({}, S); readForm(); speak(greetingText()); S = keep; };
$('save').onclick = () => {
  const before = Object.assign({}, S);
  readForm();
  if (!saveSettings()){
    S = before;
    alert('That background image is too large to save. Try a smaller image.');
    return;
  }
  applySettings(); panel.classList.remove('show');
};
$('bgClear').onclick = () => { pendingBg = ''; showBgPreview(''); };

// Shrink the chosen background image so it fits in browser storage.
$('sBg').onchange = e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const scale = Math.min(1, 1920 / img.width), c = document.createElement('canvas');
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    pendingBg = c.toDataURL('image/jpeg', 0.82); showBgPreview(pendingBg); URL.revokeObjectURL(url);
  };
  img.onerror = () => alert("Couldn't read that image. Try a JPG or PNG.");
  img.src = url;
};

/* ---- On startup: greet out loud. If sound is blocked, show WAKE. ---- */
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }
voicesReady().then(() => setTimeout(() => speak(greetingText(), showWake), 600));
</script>
